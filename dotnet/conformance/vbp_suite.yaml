      params: []
    expect: { ok: true, chunk_offsets_monotonic: true }

  - id: 1143
    name: streaming_end_with_checksum
    category: streaming
    description: "STREAM_END must carry a u32 CRC32C checksum of the concatenated payloads."
    operation:
      kind: query
      sql: "SELECT repeat('q', 2048) FROM generate_series(1, 1024);"
      params: []
    expect: { ok: true, stream_end_present: true, checksum_verifies: true }

  - id: 1144
    name: streaming_backpressure_ping
    category: streaming
    description: "PING with BACKPRESSURE flag (bit 0 of PING flags) must receive PONG before throttle applies."
    operation:
      kind: streaming_backpressure
    expect: { ok: true, pong_received_first: true, throttle_after_pong: true }

  - id: 1145
    name: streaming_payload_size_cap
    category: streaming
    description: "A frame with payload_length > server max_payload_bytes must be rejected with ERROR 53300."
    operation:
      kind: connect_then_send
      params:
        # header claims 16 MiB + 1 byte payload
        bytes_template: "56 44 42 ${LEN} 00 00 00 00 00 00"
        fill_bytes: 16777217
    expect: { ok: false, sqlstate: "53300" }

