      params: []
    expect: { ok: true, stream_begin_emitted: false }

  - id: 1141
    name: streaming_large_result_uses_stream
    category: streaming
    description: "A 1 MiB result set MUST trigger STREAM_BEGIN with expected_total_chunks > 0."
    operation:
      kind: query
      sql: "SELECT repeat('x', 1024) FROM generate_series(1, 1024);"
      params: []
    expect: { ok: true, stream_begin_emitted: true, stream_id_nonzero: true }

  - id: 1142
    name: streaming_chunks_in_offset_order
    category: streaming
    description: "STREAM_CHUNK frames must arrive with strictly monotonic offsets."
    operation:
      kind: query
